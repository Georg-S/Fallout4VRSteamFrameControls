; ============================================================================
; SteamFrameControls.ini - Context-Aware Steam Frame Controller Remapper
; ============================================================================
; Works together with: steam.app.611660_frame_controller.json (SteamVR binding)
; Compatible with: Fallout VR Essentials (Gingas), F4VRControlsConfig (MCM),
;                  FallUI VR, PipboyTabsVR, FRIK, Virtual Holsters.
;
; AVAILABLE TARGET ACTIONS (for any button below):
;   none          - Do nothing
;   l_trigger     - Left Trigger (LTrigger: Prev Category Tab in Container/Barter/Pip-Boy; Flashlight hold in gameplay)
;   r_trigger     - Right Trigger (RTrigger: Next Category Tab in Container/Barter/Pip-Boy; Primary Attack in gameplay)
;   l_grip        - Left Grip (LShoulder: Quantity step in menus; Grab / Fill Bottle in gameplay)
;   r_grip        - Right Grip (RShoulder: Quantity step in menus; Reload tap / Grenade hold in gameplay)
;   l_x           - Oculus Left X (XButton: Take All / Store All Junk in Container; Secondary Activate in gameplay)
;   l_y           - Oculus Left Y (YButton: Sort / Inspect in Container; Pause Menu in gameplay)
;   r_a           - Oculus Right A (Accept: Take/Store/Confirm in menus; Activate in gameplay)
;   r_b           - Oculus Right B (Cancel: Close/Back in menus; VATS in gameplay)
;   l_stick_click - Left Stick Click (L3: Sprint in gameplay)
;   r_stick_click - Right Stick Click (R3: Favorites Wheel in gameplay)
;   l_stick_up    - Left Stick Up (Scroll Up in menus)
;   l_stick_down  - Left Stick Down (Scroll Down in menus)
;   l_stick_left  - Left Stick Left (Switch to Player Inventory in Container; Prev Main Tab in Pip-Boy)
;   l_stick_right - Left Stick Right (Switch to Container Inventory in Container; Next Main Tab in Pip-Boy)
;   r_stick_up    - Right Stick Up (Jump in gameplay)
;   r_stick_down  - Right Stick Down (Crouch/Sneak in gameplay)
;   r_stick_left  - Right Stick Left (Turn Left in gameplay)
;   r_stick_right - Right Stick Right (Turn Right in gameplay)
; ============================================================================

[General]
; Enable debug logging of menu open/close and button presses (0 = normal, 1 = verbose)
bDebugLog=0
; Analog deflection magnitude for synthetic stick directions (0.5 - 1.0)
fStickMagnitude=0.95

; ----------------------------------------------------------------------------
; CONTAINER / BARTER / TRANSFER MENU (looting enemies, workbench transfer, trading)
; ----------------------------------------------------------------------------
[ContainerMenu]
; Left D-pad Left/Right -> switch category tabs (ALL / WEAPONS / APPAREL / AID / MISC / JUNK / MODS / AMMO)
DpadLeft=l_trigger
DpadRight=r_trigger
; Left D-pad Up/Down -> scroll item list cleanly without accidental horizontal pane switch
DpadUp=l_stick_up
DpadDown=l_stick_down
; Bumpers -> switch between Player Inventory (left) and Container/Workbench Inventory (right)
LeftBumper=l_stick_left
RightBumper=l_stick_right
; Right X / Y -> Take All / Store All Junk (X) and Sort / Inspect (Y)
RightX=l_x
RightY=l_y
; Right Menu -> Close/Cancel
RightMenu=r_b

; ----------------------------------------------------------------------------
; PIP-BOY MENU
; ----------------------------------------------------------------------------
[PipboyMenu]
; Left D-pad Left/Right -> switch sub-tabs (e.g. Weapons / Apparel / Aid / Misc / Junk / Mods / Ammo)
DpadLeft=l_trigger
DpadRight=r_trigger
; Left D-pad Up/Down -> scroll list cleanly
DpadUp=l_stick_up
DpadDown=l_stick_down
; Bumpers -> switch main Pip-Boy tabs (STAT / INV / DATA / MAP / RADIO)
LeftBumper=l_stick_left
RightBumper=l_stick_right
; Right X / Y -> Secondary action (Drop / Fav) and Sort / Perk Chart
RightX=l_x
RightY=l_y
RightMenu=r_b

; ----------------------------------------------------------------------------
; WORKSHOP / CRAFTING / COOKING MENUS
; ----------------------------------------------------------------------------
[WorkshopMenu]
; Left D-pad -> navigate workshop categories and items cleanly
DpadLeft=l_stick_left
DpadRight=l_stick_right
DpadUp=l_stick_up
DpadDown=l_stick_down
LeftBumper=l_trigger
RightBumper=r_trigger
RightX=l_x
RightY=l_y
RightMenu=r_b

; ----------------------------------------------------------------------------
; OTHER MENUS (Pause, Dialogue, Terminal, MessageBox, MainMenu, VATS)
; ----------------------------------------------------------------------------
[OtherMenu]
DpadLeft=l_stick_left
DpadRight=l_stick_right
DpadUp=l_stick_up
DpadDown=l_stick_down
LeftBumper=l_trigger
RightBumper=r_trigger
RightX=l_x
RightY=l_y
RightMenu=r_b

; ----------------------------------------------------------------------------
; GAMEPLAY (Exploration & Combat - no menu open)
; ----------------------------------------------------------------------------
[Gameplay]
; Right X = Reload (tap) / Grenade (hold), just like Xbox/Steam Deck
RightX=r_grip
; Right Y = Jump (no more awkward right-stick-up jumping!)
RightY=r_stick_up
; Left Bumper = Sprint (saves your left thumbstick from click wear)
LeftBumper=l_stick_click
; Right Bumper = Favorites Wheel
RightBumper=r_stick_click
; Right Menu = Pause Menu (mirrors Left View)
RightMenu=l_y
; Left D-pad in gameplay: quick access to Crouch, Flashlight/Secondary, Secondary Activate, VATS
DpadUp=l_trigger
DpadDown=r_stick_down
DpadLeft=l_x
DpadRight=r_b
